; Test layout for this repository.
;
; There are two suites and they are NOT interchangeable:
;
;   app/tests/  - the real application suite. Imports `roop.*` from app/.
;   tests/      - repo-root integration/benchmark harnesses. These add app/ to
;                 sys.path themselves and drive the same application package.
;
; `importmode=importlib` is the load-bearing setting. Under the default
; "prepend" mode pytest imports test modules by BASENAME, so two files named
; e.g. test_occlusion_mask.py in different directories collide and one silently
; shadows the other -- which is exactly how a stale root-level copy of the
; suite was able to run in place of the maintained one. importlib mode keys
; modules by full path, so same-named files in both suites coexist safely.
;
; `app/tests/` has an __init__.py so its modules import as `tests.<name>`;
; the repo-root `tests/` has none and its modules are keyed by full path.
; rootdir stays at the repo root so both trees are collectable.
[pytest]
testpaths = app/tests tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = --import-mode=importlib
