name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Vite 8 needs ^20.19 || >=22.12 (also declared in both package.json "engines").
  NODE_VERSION: "22"
  # The app venv is Python 3.10 and numpy 1.26.4 has no wheels past 3.12.
  PYTHON_VERSION: "3.10"

jobs:
  react-ui:
    name: react-ui lint + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: react-ui/package-lock.json
      - name: npm ci (react-ui, from its lockfile -- the same command install.js runs)
        run: npm ci --no-audit --no-fund
        working-directory: react-ui
      - run: npm run lint
        working-directory: react-ui
      - run: npm run build
        working-directory: react-ui
      - name: built UI is present
        run: test -f react-ui/dist/index.html

  typecheck:
    name: root typecheck (mock server)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck

  python-light:
    name: python tests, light profile (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      # No GPU, no model files, no torch/onnxruntime on a runner: the light
      # profile turns those imports into skips (conftest.py) and -m "not gpu"
      # deselects explicitly marked tests. The skipped count in the summary is
      # how much of the suite CI did NOT exercise.
      ROOP_TEST_LIGHT: "1"
      ROOP_REACT_CLIENT: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: app/requirements-ci.txt
      - run: python -m pip install -r app/requirements-ci.txt
      - name: pytest (both trees, GPU tests skipped)
        run: python -m pytest -m "not gpu" -q -p no:cacheprovider -rfE
