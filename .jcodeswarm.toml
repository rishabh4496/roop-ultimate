[swarm]
name = "roop-ultimate-optimization"
mode = "light-swarm" # Coordinator-worker fan-out

[swarm.models]
coordinator = { provider = "anthropic", model = "claude-opus-5-high" }
io_worker   = { provider = "openai",    model = "gpt-5.6-luna-max" }
infer_worker= { provider = "anthropic", model = "claude-opus-5-high" }
qual_worker = { provider = "google",    model = "antigravity-3.8-flash-high" }
test_worker = { provider = "google",    model = "antigravity-3.8-flash-high" }

[swarm.defaults]
auto_resync_plan = true
notify_on_peer_diff = true